<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Get the Free Guide — Launchpad Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --yellow: #F9C33B;
  --black: #1a1a1a;
  --terracotta: #C0522A;
  --off: #F0EDE6;
  --white: #ffffff;
}
body {
  font-family: 'Barlow', sans-serif;
  background: var(--off);
  color: var(--black);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
/* Make Tally iframe match page font */
iframe { font-family: 'Barlow', sans-serif; }
.page {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100svh;
  padding: 0 24px 56px 24px;
}

.topbar {
  padding: 20px 0;
  border-bottom: 1px solid rgba(0,0,0,0.1);
  margin-bottom: 36px;
}
.topbar-brand {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(0,0,0,0.4);
}

.progress {
  height: 2px;
  background: rgba(0,0,0,0.08);
  border-radius: 1px;
  margin-bottom: 40px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 50%;
  background: var(--yellow);
  animation: fill 0.7s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes fill { from { width: 0; } to { width: 50%; } }

.headline {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: clamp(34px, 8vw, 44px);
  line-height: 0.95;
  text-transform: uppercase;
  letter-spacing: -0.02em;
  color: var(--black);
  margin-bottom: 12px;
}

.subtext {
  font-family: 'Barlow', sans-serif;
  font-weight: 300;
  font-size: 15px;
  line-height: 1.72;
  color: rgba(0,0,0,0.5);
  margin-bottom: 32px;
}
.subtext strong { font-weight: 600; color: var(--terracotta); }

.tally-wrap {
  background: var(--white);
  border-radius: 2px;
  border: 1px solid rgba(0,0,0,0.08);
  padding: 8px 16px;
  margin-bottom: 4px;
}

.secure-note {
  text-align: center;
  font-family: 'Barlow', sans-serif;
  font-weight: 400;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(0,0,0,0.28);
  margin-top: 14px;
}

.fade { opacity: 0; transform: translateY(12px); animation: up 0.65s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes up { to { opacity: 1; transform: none; } }
</style>
<script async src="https://tally.so/widgets/embed.js"></script>
</head>
<body>
<div class="page">
  <div class="topbar">
    <span class="topbar-brand">Launchpad Studio</span>
  </div>

  <div class="progress fade"><div class="progress-fill"></div></div>

  <h1 class="headline fade" style="animation-delay:.05s">What email should<br>we send the PDF to?</h1>
  <p class="subtext fade" style="animation-delay:.1s"><strong>Use your real email</strong> — otherwise you won't receive the guide.</p>

  <div class="tally-wrap fade" style="animation-delay:.15s">
    <iframe data-tally-src="https://tally.so/embed/Pdryje?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1&redirectTo=https://blng.studio/launchpad/confirmation.html" loading="lazy" width="100%" height="282" frameborder="0" marginheight="0" marginwidth="0" title="Launchpad Leads"></iframe>
  </div>

  <div class="secure-note fade" style="animation-delay:.25s">Your information is 100% secure</div>
</div>
</body>
</html>
