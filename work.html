<style>
  :root { --charcoal:#1C1C1A; --porcelain:#F8F6F3; --terracotta:#D98E6A; --mustard:#FFC850; --green:#7A973F; }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; cursor:none !important; }
  html { scroll-behavior:smooth; }
  body { background:var(--porcelain); color:var(--charcoal); font-family:'DM Sans',sans-serif; font-weight:300; min-height:100vh; display:flex; flex-direction:column; }

  #cursor      { position:fixed; width:20px; height:20px; background:var(--terracotta); border-radius:50%; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); transition:transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease; opacity:0; }
  #cursor.cursor-outline { background-color: transparent; border: 2px solid var(--terracotta); }

  nav { position:fixed; top:0; left:0; right:0; z-index:100; padding:12px 48px 12px 80px; display:flex; justify-content:space-between; align-items:center; background:var(--porcelain); border-bottom:2px solid rgba(28,28,26,0.07); }
  #nav-logo { display:block; text-decoration:none; opacity:0.9; transition:opacity 0.25s; flex-shrink:0; }
  #nav-logo:hover { opacity:1; }
  #nav-logo img { width:487px; display:block; }
  .nav-links { display:flex; gap:44px; list-style:none; }
  .nav-links a { font-size:1.4rem; letter-spacing:0.12em; text-transform:uppercase; text-decoration:none; color:var(--charcoal); transition:color 0.25s; }
  .nav-links a:hover { color:var(--terracotta); }
  .nav-links a.active { color:var(--green); font-weight: 700; }

  #hover-panel { position:fixed; left:48px; top:50%; transform:translateY(-50%); z-index:50; pointer-events:none; opacity:0; transition:opacity 0.35s ease; }
  #hover-panel .ph { box-shadow:0 16px 60px rgba(28,28,26,0.15); transition:width 0.25s ease, height 0.25s ease, background 0.4s ease; display:block; }
  #hover-panel img { display:block; max-width:min(800px, calc(50vw - 72px)); max-height:85vh; box-shadow:0 16px 60px rgba(28,28,26,0.15); }

  main { flex:1; padding:200px 48px 80px 80px; }
  .filters { display:flex; gap:10px; margin-bottom:56px; flex-wrap:nowrap; justify-content:flex-end; margin-left:50%; }
  .filter-btn { font-family:'DM Sans',sans-serif; font-size:1.1rem; letter-spacing:0.14em; text-transform:uppercase; padding:10px 24px; border:2px solid rgba(28,28,26,0.25); background:transparent; color:var(--charcoal); transition:all 0.2s; flex-shrink:0; border-radius:999px; }
  .filter-btn:hover { border-color:var(--terracotta); color:var(--terracotta); }
  .filter-btn.active { background:transparent; color:var(--green); border-color:var(--green); }
  .filters { flex-wrap:wrap; }

  .list-area { margin-left:50%; }
  .project-list { border-top:2px solid rgba(28,28,26,0.1); }
  .project-row { display:grid; grid-template-columns:120px 1fr 90px; align-items:center; padding:28px 0; border-bottom:2px solid rgba(28,28,26,0.07); text-decoration:none; color:var(--charcoal); position:relative; }
  .project-row::after { content:''; position:absolute; bottom:-2px; left:0; right:0; height:2px; background:var(--terracotta); transform:scaleX(0); transform-origin:right; transition:transform 0.4s ease; }
  .project-row:hover::after { transform:scaleX(1); }
  .project-row.hidden { display:none; }
  .row-type  { font-size:1.1rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--green); }
  .row-title { font-size:2.0rem; letter-spacing:0.01em; padding:0 32px; transition:color 0.2s; }
  .row-year  { font-size:1.1rem; letter-spacing:0.1em; color:var(--green); text-align:right; }
  .project-row:hover .row-title { color:var(--terracotta); }
  /* Rows without a detail page yet — plain listing, no hover affordance */
  .project-row.is-static:hover::after { transform:scaleX(0); }
  .project-row.is-static:hover .row-title { color:var(--charcoal); }

  footer { border-top:2px solid rgba(28,28,26,0.1); padding:56px 60px; display:grid; grid-template-columns:1fr 1fr 1fr; align-items:end; flex-shrink:0; margin-top:auto; }
  .footer-address { font-size:1.2rem; line-height:1.9; color:var(--charcoal); letter-spacing:0.04em; }
  .footer-middle  { text-align:center; font-size:1.2rem; line-height:2; letter-spacing:0.04em; color:var(--charcoal); }
  .footer-right   { text-align:right; font-size:1.2rem; line-height:1.9; letter-spacing:0.04em; color:var(--charcoal); }
  footer a { color:var(--charcoal); text-decoration:underline; text-underline-offset:3px; transition:color 0.2s; }
  footer a:hover { color:var(--terracotta); }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 1024px) {
    #nav-logo img { width:401px; }
  }
  @media (max-width: 768px) {
    #nav-logo img { width:298px; }
    nav { padding:10px 20px 10px 24px; }
    .nav-links { gap:24px; }
    .nav-links a { font-size:1.2rem; }
    #hover-panel { display:none; }
    main { padding:140px 24px 60px; }
    .filters { justify-content:flex-start; gap:8px; margin-bottom:36px; margin-left:0; }
    .filter-btn { font-size:1.0rem; padding:8px 16px; }
    .list-area { margin-left:0; }
    .project-row { grid-template-columns:80px 1fr 44px; padding:20px 0; }
    .row-title { font-size:1.6rem; padding:0 16px; }
    .row-type { font-size:0.95rem; }
    footer { grid-template-columns:1fr; gap:20px; padding:40px 24px; }
    .footer-middle { text-align:left; }
    .footer-right { text-align:left; }

    /* ─── MOBILE WORK FEED (Instagram-style) ─── */
    main.mobile-work { padding-left:0; padding-right:0; padding-top:114px; }
    main.mobile-work .filters {
      display:flex; flex-wrap:nowrap; justify-content:flex-start;
      overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
      margin:0; margin-left:0; gap:16px; padding:16px 24px;
      border-bottom:2px solid rgba(28,28,26,0.08);
    }
    main.mobile-work .filters::-webkit-scrollbar { display:none; }
    main.mobile-work .filter-btn { flex-shrink:0; font-size:0.9rem; padding:7px 16px; }
    main.mobile-work .list-area { margin-left:0; }
    .mp-list { border-top:none; }
    .mp-item { border-bottom:2px solid rgba(28,28,26,0.07); background:var(--porcelain); padding-bottom:4px; }
    .mp-item.hidden { display:none; }
    .mp-name-row { display:flex; justify-content:space-between; align-items:baseline; padding:20px 24px 14px; text-decoration:none; color:var(--charcoal); }
    .mp-name-text { font-size:1.7rem; font-weight:300; letter-spacing:0.01em; line-height:1.25; }
    .mp-meta { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; margin-left:16px; }
    .mp-year { font-size:1.0rem; letter-spacing:0.1em; color:var(--green); }
    .mp-type { font-size:0.85rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--green); opacity:0.7; }
    .mp-hero { position:relative; aspect-ratio:3/2; overflow:hidden; }
    .mp-hero-track {
      display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch; scrollbar-width:none;
    }
    .mp-hero-track::-webkit-scrollbar { display:none; }
    .mp-hero-slide { flex:0 0 100%; height:100%; scroll-snap-align:start; display:block; }
    .mp-hero-slide img { width:100%; height:100%; object-fit:cover; display:block; }
    /* Scrim so the dots stay legible over light-background images too */
    .mp-hero-scrim {
      position:absolute; left:0; right:0; bottom:0; height:52px; z-index:1;
      background:linear-gradient(to top, rgba(0,0,0,0.32), transparent);
      pointer-events:none;
    }
    .mp-hero-dots {
      position:absolute; left:0; right:0; bottom:14px; z-index:2;
      display:flex; justify-content:center; gap:6px; pointer-events:none;
    }
    .mp-hero-dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.55); transition:background 0.2s, transform 0.2s; }
    .mp-hero-dot.active { background:#fff; transform:scale(1.3); }
  }
  @media (max-width: 480px) {
    #nav-logo img { width:220px; }
    nav { padding:8px 14px 8px 16px; }
    /* nav at ≤480px: logo 68px + padding 16px + border 2px = 86px */
    main.mobile-work { padding-top:86px; }
    .nav-links { gap:12px; }
    .nav-links a { font-size:1.0rem; letter-spacing:0; }
    main { padding:106px 16px 48px; }
    .filters { gap:6px; margin-bottom:28px; }
    .filter-btn { font-size:0.9rem; padding:6px 12px; }
    main.mobile-work .filters { padding:12px 16px; gap:12px; }
    main.mobile-work .filter-btn { font-size:0.8rem; padding:6px 12px; }
    .project-row { grid-template-columns:1fr 40px; padding:16px 0; }
    .row-type { display:none; }
    .row-title { font-size:1.3rem; padding:0; }
    footer { padding:28px 16px; }
  }

  /* ─── MOBILE MENU ─── */
  .menu-btn { display: none; background: none; border: none; padding: 8px; flex-direction: column; gap: 6px; align-items: center; justify-content: center; }
  .menu-btn span { display: block; width: 26px; height: 3px; background: var(--charcoal); }
  .mobile-menu { position: fixed; inset: 0; z-index: 500; display: flex; flex-direction: column; padding: 28px 24px; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
  .mobile-menu.open { opacity: 1; pointer-events: all; }
  .mobile-menu-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 72px; }
  .mobile-menu-logo { text-decoration: none; }
  .mobile-menu-logo img { width: 200px; display: block; }
  .mobile-menu-close { background: none; border: none; font-size: 1.4rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--charcoal); font-family: 'DM Sans', sans-serif; padding: 0; }
  .mobile-menu-links { list-style: none; display: flex; flex-direction: column; gap: 32px; }
  .mobile-menu-links a { font-size: 1.4rem; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; color: var(--charcoal); font-family: 'DM Sans', sans-serif; }
  .mobile-menu-links a.active { color: var(--green); font-weight: 700; }
  @media (max-width: 768px) {
    .nav-links { display: none !important; }
    .menu-btn { display: flex; }
  }
</style>

<script>
(function() {
  'use strict';

  var CLOUD = 'dgelbnw1g';

  // Footer random color
  document.querySelector('footer').style.background =
    ['#FFD67C','#B8CE88','#D98E6A'][Math.floor(Math.random() * 3)];

  // ── CURSOR (pointer devices only) ────────────────────────────
  var isTouch = window.matchMedia('(hover: none)').matches;
  var cursor;
  if (!isTouch) {
    cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', function(e) {
      cursor.style.left = e.clientX+'px'; cursor.style.top = e.clientY+'px';
      cursor.style.opacity = '1';
    });
    document.addEventListener('mouseleave', function() {
      cursor.style.opacity = '0';
    });
  }

  function setCursorScale(el) {
    if (isTouch) return;
    el.addEventListener('mouseenter', function() {
      cursor.classList.add('cursor-outline');
    });
    el.addEventListener('mouseleave', function() {
      cursor.classList.remove('cursor-outline');
    });
  }
  document.querySelectorAll('a, button').forEach(setCursorScale);

  // ── HOVER PANEL ──────────────────────────────────────────────
  var panel    = document.getElementById('hover-panel');
  var ph       = document.getElementById('panel-ph');
  var panelImg = null;
  var hideTimer = null;

  function attachHover(row) {
    row.addEventListener('mouseenter', function() {
      clearTimeout(hideTimer);
      var folder = row.dataset.folder;
      var maxH = Math.round(window.innerHeight * 0.85);
      // Cap the preview width to the actual space left of the text column,
      // measured live, so it can't overlap regardless of viewport width.
      var listLeft = document.querySelector('.list-area').getBoundingClientRect().left;
      var maxW = Math.min(800, Math.round(listLeft - 48 - 40));

      if (maxW < 160) {
        panel.style.opacity = '0';
        return;
      }

      if (folder) {
        // Load hero image from Cloudinary
        var url = 'https://res.cloudinary.com/' + CLOUD +
                  '/image/upload/f_auto,q_auto,w_800/' + folder + '-01';
        ph.style.display = 'none';
        if (!panelImg) {
          panelImg = document.createElement('img');
          panel.appendChild(panelImg);
        }
        panelImg.style.cssText = 'display:block;max-width:'+maxW+'px;max-height:'+maxH+'px;box-shadow:0 16px 60px rgba(28,28,26,0.15);';
        panelImg.src = url;
        panelImg.style.display = 'block';
      } else {
        if (panelImg) panelImg.style.display = 'none';
        ph.style.display = 'block';
        ph.style.width   = '300px';
        ph.style.height  = '400px';
        ph.style.background = 'linear-gradient(135deg,#c4b8a8,#9a8878)';
      }
      panel.style.opacity = '1';
    });
    row.addEventListener('mouseleave', function() {
      hideTimer = setTimeout(function() { panel.style.opacity = '0'; }, 120);
    });
    setCursorScale(row);
  }

  // ── LOAD & RENDER PROJECTS ───────────────────────────────────
  var allProjects = [];
  var activeFilter = 'all';

  // Selected projects float to the top of the list, in this explicit order,
  // and show "Selected" instead of the year. Ordering by array position in
  // projects.json would be fragile as new projects get added, so this reads
  // the "selected" flag on each project instead.
  var SELECTED_ORDER = [
    'holsten-residential-district',
    'mextropoli-pavilion',
    'sophienschule-campus',
    'seminary-chapel',
    'wikus-headquarters-conference-centre'
  ];
  function orderProjects(projects) {
    var bySlug = {};
    projects.forEach(function(p) { bySlug[p.slug] = p; });
    var selected = SELECTED_ORDER.map(function(slug) { return bySlug[slug]; }).filter(Boolean);
    var rest = projects.filter(function(p) { return !p.selected; });
    rest.sort(function(a, b) { return parseInt(b.year, 10) - parseInt(a.year, 10); });
    return selected.concat(rest);
  }

  function renderRows() {
    var list = document.getElementById('project-list');
    list.innerHTML = '';
    allProjects.forEach(function(p) {
      var typeLabel = p.type[0] || '';
      var typesLower = p.type.map(function(t){ return t.toLowerCase(); });
      var hasPage = p.hasPage !== false;
      // Projects without a detail page (no images/full write-up yet) render as
      // a plain, non-clickable row — same layout, no link, no hover preview.
      var row = document.createElement(hasPage ? 'a' : 'div');
      row.className = 'project-row' + (hasPage ? '' : ' is-static');
      if (hasPage) row.href = 'project.html?project=' + encodeURIComponent(p.slug);
      row.dataset.types  = p.type.join(',').toLowerCase();
      if (hasPage) row.dataset.folder = p.folder;
      row.innerHTML =
        '<span class="row-type">'  + escHtml(typeLabel)  + '</span>' +
        '<span class="row-title">' + escHtml(p.title)    + '</span>' +
        '<span class="row-year">'  + escHtml(p.selected ? 'Selected' : p.year) + '</span>';

      // Apply current filter
      if (activeFilter !== 'all' && typesLower.indexOf(activeFilter) === -1) {
        row.classList.add('hidden');
      }

      list.appendChild(row);
      if (hasPage) attachHover(row);
    });
  }

  function buildFilters(projects) {
    var typeSet = {};
    projects.forEach(function(p) {
      p.type.forEach(function(t) { typeSet[t] = true; });
    });
    var types = Object.keys(typeSet).sort();
    var bar = document.getElementById('filter-bar');
    bar.innerHTML = '';

    var allBtn = document.createElement('button');
    allBtn.className = 'filter-btn active';
    allBtn.dataset.filter = 'all';
    allBtn.textContent = 'All';
    bar.appendChild(allBtn);

    types.forEach(function(t) {
      var btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.dataset.filter = t.toLowerCase();
      btn.textContent = t;
      bar.appendChild(btn);
    });

    bar.querySelectorAll('.filter-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        bar.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        panel.style.opacity = '0';
        document.querySelectorAll('.project-row, .mp-item').forEach(function(row) {
          var types = row.dataset.types ? row.dataset.types.split(',') : [];
          row.classList.toggle('hidden', activeFilter !== 'all' && types.indexOf(activeFilter) === -1);
        });
      });
      setCursorScale(btn);
    });
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── MOBILE: INSTAGRAM-STYLE FEED ─────────────────────────────
  // Cloudinary numbering isn't always sequential from 1 — photos get
  // reordered/deleted during editing, so real images can jump straight
  // from -01 to -07, or skip around entirely (e.g. -01, -10, -11, -12).
  // We probe a wide range per project (cheap thumbnails) to find every
  // real photo regardless of gaps, then display up to HERO_DISPLAY_CAP
  // of them. Probing is deferred per-card via IntersectionObserver so a
  // 50+ project feed doesn't fire hundreds of requests on page load.
  var HERO_PROBE_MAX   = 25;
  var HERO_DISPLAY_CAP = 8;

  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  function heroUrl(folder, n, width) {
    return 'https://res.cloudinary.com/' + CLOUD +
           '/image/upload/f_auto,q_auto,w_' + width + '/' + folder + '-' + pad2(n);
  }

  function renderMobile(projects) {
    var mainEl = document.querySelector('main');
    mainEl.classList.add('mobile-work');

    var list = document.getElementById('project-list');
    list.className = 'mp-list';
    list.innerHTML = '';

    projects.forEach(function(p, i) {
      var typeLabel = (p.type && p.type[0]) ? p.type[0] : '';
      var hasPage = p.hasPage !== false;

      var item = document.createElement('div');
      item.className = 'mp-item' + (hasPage ? '' : ' is-static');
      item.dataset.types = p.type.join(',').toLowerCase();
      if (activeFilter !== 'all' && item.dataset.types.split(',').indexOf(activeFilter) === -1) {
        item.classList.add('hidden');
      }

      var nameRowTag = hasPage ? 'a' : 'div';
      var nameRowHref = hasPage ? ' href="project.html?project=' + encodeURIComponent(p.slug) + '"' : '';
      var nameRowHtml =
        '<' + nameRowTag + ' class="mp-name-row"' + nameRowHref + '>' +
          '<span class="mp-name-text">' + escHtml(p.title) + '</span>' +
          '<span class="mp-meta">' +
            '<span class="mp-year">' + escHtml(p.selected ? 'Selected' : p.year) + '</span>' +
            (typeLabel ? '<span class="mp-type">' + escHtml(typeLabel) + '</span>' : '') +
          '</span>' +
        '</' + nameRowTag + '>';

      // Projects without a detail page (no images/full write-up yet) show
      // only the name row — no hero image carousel to probe for.
      if (!hasPage) {
        item.innerHTML = nameRowHtml;
        list.appendChild(item);
        return;
      }

      var altText = escHtml(p.title + (p.location ? ', ' + p.location : '') + ' — blng studio');
      var slide1Url = heroUrl(p.folder, 1, 900);
      item.innerHTML =
        nameRowHtml +
        '<div class="mp-hero" data-folder="' + escHtml(p.folder) + '" data-slug="' + escHtml(p.slug) + '" data-alt="' + altText + '">' +
          '<div class="mp-hero-track">' +
            '<a class="mp-hero-slide" href="project.html?project=' + encodeURIComponent(p.slug) + '">' +
              '<img src="' + escHtml(slide1Url) + '" alt="' + altText + '" ' + (i === 0 ? 'loading="eager"' : 'loading="lazy"') + '>' +
            '</a>' +
          '</div>' +
          '<div class="mp-hero-scrim" style="display:none;"></div>' +
          '<div class="mp-hero-dots" style="display:none;"></div>' +
        '</div>';

      list.appendChild(item);
    });

    observeHeroCarousels();
  }

  var heroObserver = null;
  function observeHeroCarousels() {
    var heroEls = document.querySelectorAll('.mp-hero');
    if (!('IntersectionObserver' in window)) {
      heroEls.forEach(probeHeroCarousel);
      return;
    }
    if (heroObserver) heroObserver.disconnect();
    heroObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          heroObserver.unobserve(entry.target);
          probeHeroCarousel(entry.target);
        }
      });
    }, { rootMargin: '1000px 0px' });
    heroEls.forEach(function(el) { heroObserver.observe(el); });
  }

  // Probes -02.. up to HERO_PROBE_MAX in parallel (tiny thumbnails), takes
  // whichever real photos it finds in order, and builds the slides + dots
  // for however many were found (capped at HERO_DISPLAY_CAP).
  function probeHeroCarousel(heroEl) {
    if (heroEl.dataset.probed) return;
    heroEl.dataset.probed = '1';

    var folder = heroEl.dataset.folder;
    var slug   = heroEl.dataset.slug;
    var alt    = heroEl.dataset.alt;
    var checks = [];

    for (var n = 2; n <= HERO_PROBE_MAX; n++) {
      (function(num) {
        checks.push(new Promise(function(resolve) {
          var img = new Image();
          img.onload  = function() { resolve(num); };
          img.onerror = function() { resolve(null); };
          img.src = heroUrl(folder, num, 100);
        }));
      })(n);
    }

    Promise.all(checks).then(function(results) {
      var extra = results.filter(Boolean).sort(function(a, b) { return a - b; })
                          .slice(0, HERO_DISPLAY_CAP - 1);
      if (extra.length === 0) return; // only one real photo — leave as a static image

      var track   = heroEl.querySelector('.mp-hero-track');
      var dotsEl  = heroEl.querySelector('.mp-hero-dots');
      var scrimEl = heroEl.querySelector('.mp-hero-scrim');

      extra.forEach(function(n) {
        var a = document.createElement('a');
        a.className = 'mp-hero-slide';
        a.href = 'project.html?project=' + encodeURIComponent(slug);
        var img = document.createElement('img');
        img.src = heroUrl(folder, n, 900);
        img.alt = alt;
        img.loading = 'lazy';
        a.appendChild(img);
        track.appendChild(a);
      });

      var total = 1 + extra.length;
      var dotsHtml = '';
      for (var d = 0; d < total; d++) {
        dotsHtml += '<span class="mp-hero-dot' + (d === 0 ? ' active' : '') + '"></span>';
      }
      dotsEl.innerHTML = dotsHtml;
      dotsEl.style.display = 'flex';
      scrimEl.style.display = 'block';

      track.addEventListener('scroll', function() {
        window.requestAnimationFrame(function() {
          var index = Math.round(track.scrollLeft / track.clientWidth);
          dotsEl.querySelectorAll('.mp-hero-dot').forEach(function(dot, i) {
            dot.classList.toggle('active', i === index);
          });
        });
      }, { passive: true });
    });
  }

  fetch('projects.json')
    .then(function(r){ return r.json(); })
    .then(function(projects) {
      projects = orderProjects(projects);
      allProjects = projects;
      buildFilters(projects);
      if (window.innerWidth <= 768) {
        renderMobile(projects);
      } else {
        renderRows();
      }
    })
    .catch(function(){ /* show nothing on error */ });

})();
</script>
